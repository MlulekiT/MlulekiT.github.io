<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
Dr Mluleki Tsawe | Population Health Across the Life Course
</title>

<meta
    name="description"
    content="Dr Mluleki Tsawe is a Senior Lecturer in Population Studies and Demography at North-West University. His research examines population health, households, demographic change, health inequalities and ageing across the life course in Sub-Saharan Africa."
>

<meta
    name="author"
    content="Dr Mluleki Tsawe"
>

<meta
    property="og:title"
    content="Dr Mluleki Tsawe | Population Health Across the Life Course"
>

<meta
    property="og:description"
    content="Population health, demography, households, health inequalities and ageing across the life course in Sub-Saharan Africa."
>

<meta
    property="og:type"
    content="website"
>


<style>

/* =========================================================
   ROOT
========================================================= */

:root {

    --purple:#6c3d91;
    --purple-dark:#4c2868;

    --teal:#008899;
    --teal-dark:#006d77;

    --gold:#ffd525;

    --ink:#17202a;
    --muted:#5f6b76;

    --soft:#f5f7f9;
    --soft-purple:#f5f0f8;
    --soft-teal:#eef8f8;

    --white:#ffffff;

    --border:#e3e7eb;

    --max:1180px;

    --radius:14px;

    --shadow:
        0 10px 30px rgba(23,32,42,0.07);

    --transition:
        180ms ease;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing:border-box;
}

html {

    scroll-behavior:smooth;

    scroll-padding-top:80px;
}

body {

    margin:0;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color:var(--ink);

    background:var(--white);

    line-height:1.7;

    -webkit-font-smoothing:antialiased;
}

img {

    max-width:100%;

    display:block;
}

a {

    color:inherit;
}

.container {

    width:min(
        var(--max),
        calc(100% - 40px)
    );

    margin:0 auto;
}


/* =========================================================
   ACCESSIBILITY
========================================================= */

.skip-link {

    position:absolute;

    left:-9999px;

    top:10px;

    z-index:9999;

    background:var(--purple);

    color:white;

    padding:10px 16px;

    border-radius:6px;
}

.skip-link:focus {

    left:10px;
}

:focus-visible {

    outline:3px solid var(--gold);

    outline-offset:3px;
}


/* =========================================================
   NAVIGATION
========================================================= */

.site-nav {

    position:sticky;

    top:0;

    z-index:1000;

    background:
        rgba(255,255,255,0.96);

    border-bottom:
        1px solid var(--border);

    backdrop-filter:blur(12px);
}

.nav-inner {

    min-height:72px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:25px;
}

.brand {

    text-decoration:none;

    font-weight:800;

    letter-spacing:-0.02em;

    color:var(--purple);

    white-space:nowrap;
}

.brand span {

    display:block;

    font-size:0.72rem;

    font-weight:600;

    letter-spacing:0.08em;

    text-transform:uppercase;

    color:var(--muted);
}

.nav-links {

    display:flex;

    align-items:center;

    justify-content:flex-end;

    gap:4px;

    overflow-x:auto;
}

.nav-links a {

    text-decoration:none;

    padding:9px 11px;

    font-size:0.88rem;

    font-weight:650;

    color:var(--muted);

    border-radius:7px;

    white-space:nowrap;

    transition:
        background var(--transition),
        color var(--transition);
}

.nav-links a:hover {

    background:var(--soft-purple);

    color:var(--purple);
}


/* =========================================================
   HERO
========================================================= */

.hero {

    position:relative;

    overflow:hidden;

    padding:105px 0 95px;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #faf8fc 48%,
            #f0f9f9 100%
        );
}

.hero::after {

    content:"";

    position:absolute;

    width:420px;

    height:420px;

    right:-160px;

    top:-160px;

    border-radius:50%;

    border:
        70px solid
        rgba(108,61,145,0.06);
}

.hero-grid {

    position:relative;

    z-index:2;

    display:grid;

    grid-template-columns:
        minmax(0,1.55fr)
        minmax(260px,0.45fr);

    gap:80px;

    align-items:center;
}

.eyebrow {

    display:inline-flex;

    align-items:center;

    gap:9px;

    margin-bottom:20px;

    color:var(--purple);

    font-size:0.78rem;

    font-weight:800;

    letter-spacing:0.13em;

    text-transform:uppercase;
}

.eyebrow::before {

    content:"";

    width:30px;

    height:3px;

    background:var(--gold);

    border-radius:3px;
}

.hero h1 {

    margin:0 0 14px;

    max-width:850px;

    font-size:
        clamp(3rem,7vw,5.5rem);

    line-height:0.98;

    letter-spacing:-0.055em;

    color:var(--ink);
}

.hero h1 span {

    color:var(--purple);
}

.hero-title {

    max-width:800px;

    margin:0 0 24px;

    font-size:
        clamp(1.25rem,2.5vw,1.7rem);

    line-height:1.35;

    font-weight:600;

    color:var(--teal-dark);
}

.hero-description {

    max-width:800px;

    margin:0;

    font-size:1.08rem;

    color:var(--muted);
}

.hero-actions {

    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:32px;
}

.button {

    display:inline-flex;

    align-items:center;

    justify-content:center;

    min-height:46px;

    padding:0 19px;

    border-radius:7px;

    text-decoration:none;

    font-size:0.9rem;

    font-weight:750;

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        background var(--transition),
        color var(--transition);
}

.button:hover {

    transform:translateY(-2px);
}

.button-primary {

    background:var(--purple);

    color:white;

    box-shadow:
        0 7px 18px
        rgba(108,61,145,0.18);
}

.button-primary:hover {

    background:var(--purple-dark);
}

.button-secondary {

    background:white;

    color:var(--purple);

    border:
        1px solid var(--border);
}

.button-secondary:hover {

    border-color:var(--purple);
}


/* =========================================================
   HERO PROFILE CARD
========================================================= */

.identity-card {

    position:relative;

    padding:30px;

    background:
        rgba(255,255,255,0.88);

    border:
        1px solid
        rgba(108,61,145,0.12);

    border-radius:18px;

    box-shadow:var(--shadow);

    text-align:center;
}

.identity-initials {

    width:105px;

    height:105px;

    margin:0 auto 22px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--teal)
        );

    color:white;

    font-size:2rem;

    font-weight:800;

    letter-spacing:-0.04em;

    box-shadow:
        0 0 0 5px white,
        0 0 0 7px var(--purple);
}

.identity-card h2 {

    margin:0;

    font-size:1.25rem;

    color:var(--ink);
}

.identity-role {

    margin:7px 0 20px;

    font-size:0.9rem;

    color:var(--muted);
}

.identity-links {

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:8px;
}

.identity-links a {

    text-decoration:none;

    padding:7px 10px;

    font-size:0.78rem;

    font-weight:700;

    color:var(--purple);

    background:var(--soft-purple);

    border-radius:6px;
}

.identity-links a:hover {

    background:var(--purple);

    color:white;
}


/* =========================================================
   SECTION SYSTEM
========================================================= */

section {

    padding:92px 0;

    border-top:
        1px solid var(--border);
}

.section-label {

    margin-bottom:10px;

    font-size:0.75rem;

    font-weight:800;

    letter-spacing:0.13em;

    text-transform:uppercase;

    color:var(--teal);
}

.section-title {

    max-width:780px;

    margin:0 0 18px;

    font-size:
        clamp(2rem,4vw,3rem);

    line-height:1.1;

    letter-spacing:-0.035em;

    color:var(--ink);
}

.section-intro {

    max-width:790px;

    margin:0;

    font-size:1.05rem;

    color:var(--muted);
}


/* =========================================================
   RESEARCH IDENTITY
========================================================= */

.research-question {

    margin:42px 0 45px;

    padding:30px 35px;

    background:var(--soft-purple);

    border-left:
        5px solid var(--purple);

    border-radius:
        0 12px 12px 0;
}

.research-question strong {

    display:block;

    margin-bottom:8px;

    font-size:0.76rem;

    text-transform:uppercase;

    letter-spacing:0.12em;

    color:var(--purple);
}

.research-question p {

    margin:0;

    font-size:
        clamp(1.25rem,2.4vw,1.65rem);

    line-height:1.4;

    font-weight:650;

    color:var(--ink);
}


/* =========================================================
   PILLARS
========================================================= */

.pillars {

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:18px;
}

.pillar {

    position:relative;

    min-height:260px;

    padding:27px;

    background:white;

    border:
        1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:
        0 5px 20px
        rgba(23,32,42,0.035);

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
}

.pillar:hover {

    transform:translateY(-5px);

    border-color:
        rgba(108,61,145,0.3);

    box-shadow:var(--shadow);
}

.pillar-number {

    display:inline-flex;

    width:36px;

    height:36px;

    align-items:center;

    justify-content:center;

    margin-bottom:22px;

    background:var(--soft-purple);

    color:var(--purple);

    border-radius:50%;

    font-size:0.78rem;

    font-weight:800;
}

.pillar h3 {

    margin:0 0 10px;

    font-size:1.1rem;

    line-height:1.35;

    color:var(--purple);
}

.pillar p {

    margin:0;

    font-size:0.92rem;

    color:var(--muted);
}


/* =========================================================
   LIFE COURSE
========================================================= */

.life-course {

    margin-top:50px;

    display:grid;

    grid-template-columns:
        repeat(6,minmax(0,1fr));

    border:
        1px solid var(--border);

    border-radius:var(--radius);

    overflow:hidden;
}

.life-stage {

    min-height:190px;

    padding:22px 18px;

    background:white;

    border-right:
        1px solid var(--border);
}

.life-stage:last-child {

    border-right:0;
}

.life-stage span {

    display:block;

    margin-bottom:16px;

    font-size:0.7rem;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:0.08em;

    color:var(--teal);
}

.life-stage h3 {

    margin:0 0 8px;

    font-size:0.95rem;

    line-height:1.35;
}

.life-stage p {

    margin:0;

    font-size:0.82rem;

    line-height:1.55;

    color:var(--muted);
}


/* =========================================================
   CURRENT RESEARCH
========================================================= */

.current-section {

    background:var(--soft);
}

.research-grid {

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:20px;

    margin-top:42px;
}

.research-card {

    padding:30px;

    background:white;

    border:
        1px solid var(--border);

    border-radius:var(--radius);

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
}

.research-card:hover {

    transform:translateY(-4px);

    border-color:
        rgba(108,61,145,0.3);

    box-shadow:var(--shadow);
}

.research-card .tag {

    display:inline-block;

    margin-bottom:15px;

    padding:5px 9px;

    background:var(--soft-teal);

    color:var(--teal-dark);

    border-radius:5px;

    font-size:0.7rem;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:0.08em;
}

.research-card h3 {

    margin:0 0 10px;

    font-size:1.2rem;

    color:var(--ink);
}

.research-card p {

    margin:0;

    color:var(--muted);

    font-size:0.92rem;
}


/* =========================================================
   SCHOLARSHIP
========================================================= */

.scholarship-grid {

    display:grid;

    grid-template-columns:
        minmax(0,1.3fr)
        minmax(260px,0.7fr);

    gap:60px;

    margin-top:40px;
}

.publications {

    border-top:
        1px solid var(--border);
}

.publication {

    padding:22px 0;

    border-bottom:
        1px solid var(--border);
}

.publication a {

    display:block;

    text-decoration:none;

    border-radius:8px;

    padding:4px;

    margin:-4px;

    transition:
        background var(--transition);
}

.publication a:hover {

    background:var(--soft-purple);
}

.publication a:hover h3 {

    text-decoration:underline;

    color:var(--teal-dark);
}

.publication h3 {

    margin:0 0 7px;

    font-size:1rem;

    line-height:1.45;

    color:var(--purple);
}

.publication p {

    margin:0;

    font-size:0.85rem;

    color:var(--muted);
}

.publication-link {

    display:inline-block;

    margin-top:8px;

    font-size:0.76rem;

    font-weight:700;

    color:var(--teal);
}

.metric-panel {

    padding:28px;

    background:var(--soft-purple);

    border-radius:var(--radius);
}

.metric-panel h3 {

    margin-top:0;

    color:var(--purple);
}

.metric {

    padding:18px 0;

    border-bottom:
        1px solid
        rgba(108,61,145,0.15);
}

.metric:last-child {

    border-bottom:0;
}

.metric strong {

    display:block;

    font-size:1.9rem;

    line-height:1.1;

    color:var(--purple);
}

.metric span {

    font-size:0.82rem;

    color:var(--muted);
}


/* =========================================================
   METHODS
========================================================= */

.methods-section {

    background:var(--ink);

    color:white;
}

.methods-section .section-title {

    color:white;
}

.methods-section .section-intro {

    color:#bdc6cf;
}

.methods-grid {

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:18px;

    margin-top:42px;
}

.method-card {

    padding:28px;

    background:
        rgba(255,255,255,0.055);

    border:
        1px solid
        rgba(255,255,255,0.1);

    border-radius:var(--radius);
}

.method-card h3 {

    margin:0 0 13px;

    color:var(--gold);

    font-size:1rem;
}

.method-card ul {

    padding:0;

    margin:0;

    list-style:none;
}

.method-card li {

    padding:7px 0;

    font-size:0.88rem;

    color:#d7dde2;

    border-bottom:
        1px solid
        rgba(255,255,255,0.07);
}

.method-card li:last-child {

    border-bottom:0;
}


/* =========================================================
   RECENT MODULES TAUGHT
========================================================= */

.modules-grid {

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:18px;

    margin-top:40px;
}

.module-card {

    padding:27px;

    background:var(--soft);

    border:
        1px solid var(--border);

    border-radius:var(--radius);

    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

.module-card:hover {

    transform:translateY(-4px);

    box-shadow:var(--shadow);
}

.module-code {

    display:inline-block;

    margin-bottom:12px;

    padding:5px 9px;

    background:var(--soft-purple);

    color:var(--purple);

    border-radius:5px;

    font-size:0.72rem;

    font-weight:800;

    letter-spacing:0.07em;
}

.module-card h3 {

    margin:0;

    color:var(--ink);

    font-size:1rem;

    line-height:1.4;
}


/* =========================================================
   PROFILE / CV
========================================================= */

.profile-section {

    background:white;
}

.profile-grid {

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:18px;

    margin-top:40px;
}

.profile-card {

    padding:28px;

    border:
        1px solid var(--border);

    border-radius:var(--radius);
}

.profile-card h3 {

    margin:0 0 10px;

    color:var(--purple);
}

.profile-card p {

    margin:0;

    font-size:0.9rem;

    color:var(--muted);
}


/* =========================================================
   CONTACT
========================================================= */

.contact {

    background:var(--purple);

    color:white;
}

.contact .section-label {

    color:var(--gold);
}

.contact .section-title {

    color:white;
}

.contact-grid {

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(280px,0.8fr);

    gap:70px;

    align-items:start;
}

.contact-copy {

    max-width:650px;

    color:#e4dced;
}

.contact-details {

    padding:27px;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid
        rgba(255,255,255,0.13);

    border-radius:var(--radius);
}

.contact-details strong {

    display:block;

    margin-bottom:5px;

    color:var(--gold);
}

.contact-details p {

    margin:0 0 20px;

    color:#eee;
}

.contact-details p:last-child {

    margin-bottom:0;
}

.contact-details a {

    color:white;

    text-decoration:underline;
}

.contact-links {

    display:flex;

    flex-wrap:wrap;

    gap:9px;

    margin-top:25px;
}

.contact-links a {

    padding:8px 12px;

    background:white;

    color:var(--purple);

    border-radius:6px;

    text-decoration:none;

    font-size:0.8rem;

    font-weight:750;

    transition:
        transform var(--transition),
        background var(--transition);
}

.contact-links a:hover {

    transform:translateY(-2px);

    background:var(--gold);
}


/* =========================================================
   FOOTER
========================================================= */

footer {

    padding:30px 0;

    background:#111820;

    color:#aeb8c1;
}

.footer-inner {

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}

.footer-title {

    color:white;

    font-weight:750;

    font-size:0.9rem;
}

.footer-small {

    font-size:0.78rem;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width:1000px) {

    .hero-grid {

        grid-template-columns:1fr;

        gap:45px;
    }

    .identity-card {

        max-width:500px;

        margin:0 auto;
    }

    .pillars {

        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .life-course {

        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .life-stage:nth-child(3) {

        border-right:0;
    }

    .life-stage:nth-child(-n+3) {

        border-bottom:
            1px solid var(--border);
    }

    .scholarship-grid {

        grid-template-columns:1fr;
    }

}


@media (max-width:760px) {

    .container {

        width:min(
            100% - 28px,
            var(--max)
        );
    }

    .site-nav {

        position:relative;
    }

    .nav-inner {

        padding:12px 0;

        align-items:flex-start;

        flex-direction:column;

        gap:10px;
    }

    .nav-links {

        width:100%;

        justify-content:flex-start;
    }

    .hero {

        padding:70px 0 65px;
    }
